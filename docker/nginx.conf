server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La app es una SPA con react-router: las rutas (/ventas, /balance...) no
    # son archivos en disco, las resuelve React en el navegador. Sin esta
    # linea, entrar directo a /ventas o recargar con F5 daria 404 de nginx,
    # porque nginx buscaria un archivo llamado "ventas" y no existe.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets llevan hash en el nombre (index-a1b2c3.js): si el contenido
    # cambia, cambia el nombre, asi que se pueden cachear sin miedo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
